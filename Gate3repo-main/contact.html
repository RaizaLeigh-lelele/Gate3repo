<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Barangay Gay</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    </head>

    <body>
        <header class="hero is-primary">
            <div class="hero-body">
                <div class="container">
                    <h1 class="title">Barangay Gay</h1>
                    <h2 class="subtitle">Contact Us Ngani Goo Gaa Gaa Gay</h2>
                </div>
            </div>
        </header>

        <section class="section">
            <div class="container">
                <form>
                    <div class="field">
                        <label class="label" for="name">Name</label>
                        <div class="control">
                            <input class="input" type="text" id="name" name="name" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label" for="email">Email</label>
                        <div class="control">
                            <input class="input" type="email" id="email" name="email" required>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label" for="message">Message</label>
                        <div class="control">
                            <textarea class="textarea" id="message" name="message" required></textarea>
                        </div>
                    </div>

                    <div class="field is-grouped">
                        <div class="control">
                            <button class="button is-primary" type="submit" >Submit</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <footer class="footer">
            <div class="content has-text-centered">
                <p>2026 Barangay Gay. All rights reserved</p>
            </div>
        </footer>
    </body>
